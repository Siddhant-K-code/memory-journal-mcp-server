name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - name: Ensure FFmpeg for real film-rendering tests
        run: |
          if ! command -v ffmpeg; then
            brew install ffmpeg
          fi
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python -m pytest -q
