[project]
name = "memory-journal-mcp-server"
version = "0.2.0"
description = "MCP server for memory journal from local photos (iCloud Photos)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23.0",
    "mcp>=1.26,<2",
    "osxphotos>=0.77.2,<0.78",
    "pillow>=11,<13",
    "thefuzz>=0.22.1",
]

[[project.authors]]
name = "Siddhant Khare"
email = "siddhantkhare2694@gmail.com"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "SIM"]
